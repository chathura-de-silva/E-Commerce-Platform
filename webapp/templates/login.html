{% extends 'layout.html' %}
{% block title %} {{ title }} {% endblock %}
{% block content %}
<style>
    /* Add some styles to the background image and container */
    .form-page {
        min-height: calc(100vh - 90px); /* 90px = fixed header height in main.css */
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        box-sizing: border-box;
        background-image: url('/static/main-backdrop.jpg');
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: fixed;
        font-family: Arial, sans-serif;
    }

    .form-container {
        background-color: rgba(255, 255, 255, 0.9); /* Add a semi-transparent white background for the form */
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        max-width: 400px;
        width: 100%; /* Ensure the form takes up the available width */
        box-sizing: border-box;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center; /* Center the form items horizontally */
    }

    .links {
        text-align: center;
        margin-top: 20px;
    }

    /* Add some styles to the form elements */
    .form-group {
        margin: 15px 0;
        position: relative;
        width: 100%;
    }

    label {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: #333;
    }

    input[type="text"],
    input[type="password"],
    input[type="email"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 16px;
        padding-left: 40px;
        box-sizing: border-box;
    }

    input[type="submit"] {
        background-color: #453a2d;
        color: #fff;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        width: 100%;
    }

    .msg {
        color: red;
        font-weight: bold;
        margin-top: 10px;
    }

    @media (max-width: 480px) {
        .form-page {
            min-height: calc(100vh - 60px);
            padding: 20px 12px;
        }
        .form-container {
            padding: 16px;
        }
    }
</style>

<div class="form-page">
    <div class="form-container">
        {% include "alert.html" %}
        <div class="links">
            <p>Not a user already? <a href="{{ url_for('signup') }}">Register</a></p>
        </div>
        <form action="{{ url_for('login') }}" method="post">
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i>
                </label>
                <input type="text" name="username" placeholder="Username" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i>
                </label>
                <input type="password" name="password" placeholder="Password" id="password" required>
            </div>
            <div class="msg">{{ msg }}</div>
            <input type="submit" value="Login">
        </form>
    </div>
</div>
{% endblock %}
